<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Clerk test chat</title>
<style>
:root { --bg:#efeae2; --panel:#f0f2f5; --me:#d9fdd3; --bot:#fff; --ink:#111b21; --muted:#667781; --line:#d1d7db; --accent:#00a884; --warn:#b3261e; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0b141a; --panel:#202c33; --me:#005c4b; --bot:#202c33; --ink:#e9edef; --muted:#8696a0; --line:#2a3942; --warn:#f2b8b5; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { font-size: 17px; margin: 0; }
button { font: inherit; }
.link { background: none; border: 0; color: var(--accent); padding: 6px 0; cursor: pointer; }
details { margin-top: 6px; }
summary { color: var(--muted); font-size: 14px; cursor: pointer; }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
input, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bot); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
#log { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; background: var(--bot); box-shadow: 0 1px 1px rgba(0, 0, 0, .12); }
.msg.me { align-self: flex-end; background: var(--me); }
.msg.sys { align-self: center; max-width: 95%; background: transparent; box-shadow: none; color: var(--warn); text-align: center; font-size: 14px; }
.msg.note { align-self: center; max-width: 95%; background: transparent; box-shadow: none; color: var(--muted); text-align: center; font-size: 13px; }
.msg.wait { color: var(--muted); }
.text { white-space: pre-wrap; overflow-wrap: anywhere; }
.tag { margin-top: 4px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.chips { display: flex; gap: 8px; padding: 6px 16px; overflow-x: auto; background: var(--bg); }
.chip { flex: none; border: 1px solid var(--line); background: var(--bot); color: var(--ink); border-radius: 16px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
form { display: flex; gap: 8px; align-items: flex-end; padding: 8px 16px; padding-bottom: max(8px, env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); }
textarea { resize: none; max-height: 120px; border-radius: 20px; }
#go { flex: none; width: 46px; height: 46px; border: 0; border-radius: 50%; background: var(--accent); color: #fff; font-size: 20px; cursor: pointer; }
#go:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Clerk test chat</h1>
    <button type="button" class="link" id="clear">Clear</button>
  </div>
  <details id="setup" open>
    <summary>Who is typing</summary>
    <label for="pass">Test chat passcode</label>
    <input id="pass" type="password" autocomplete="off" placeholder="the CHAT_PASSCODE you set on Vercel">
    <label for="who">Phone number of a team member</label>
    <input id="who" type="tel" autocomplete="off" placeholder="the number saved in your users table">
  </details>
</header>

<main id="log"></main>

<div class="chips" id="chips"></div>

<form id="form">
  <textarea id="text" rows="1" placeholder="Type like you would on WhatsApp" enterkeyhint="send"></textarea>
  <button id="go" type="submit" aria-label="Send">&#10148;</button>
</form>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

// Browser storage can be blocked, so every use is wrapped and the page works without it.
const store = {
  get(key) { try { return localStorage.getItem(key) || ""; } catch (e) { return ""; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* not saved, that's fine */ } },
};

function add(kind, text, tag) {
  const box = document.createElement("div");
  box.className = "msg " + kind;
  const body = document.createElement("div");
  body.className = "text";
  body.textContent = text; // textContent, never innerHTML: nothing a reply says can run as code
  box.appendChild(body);
  if (tag) {
    const small = document.createElement("div");
    small.className = "tag";
    small.textContent = tag;
    box.appendChild(small);
  }
  $("log").appendChild(box);
  box.scrollIntoView({ block: "end" });
  return box;
}

const newId = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2));

function remember() {
  store.set("clerk.pass", $("pass").value);
  store.set("clerk.who", $("who").value);
}

async function send(text) {
  remember();
  const pass = $("pass").value.trim();
  const who = $("who").value.trim();
  if (!pass || !who) {
    $("setup").open = true;
    add("sys", "Fill in the passcode and a phone number first.");
    return;
  }
  add("me", text);
  const waiting = add("bot wait", "...");
  $("go").disabled = true;
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json", "x-chat-passcode": pass },
      body: JSON.stringify({ message: text, sender: who, id: newId() }),
    });
    waiting.remove();
    if (res.status === 404) {
      add("sys", "The test chat is switched off on this site (CHAT_PASSCODE is not set, or is too short).");
      return;
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* handled below */ }
    if (!res.ok || !data || !data.ok) {
      add("sys", (data && data.error) || "Something went wrong (code " + res.status + ").");
      return;
    }
    const tag = data.outcome + (data.detail ? " | " + data.detail : "");
    add("bot", data.reply === null ? "(That exact message was already handled, so nothing was done.)" : data.reply, tag);
  } catch (e) {
    waiting.remove();
    add("sys", "Could not reach the server. Check your connection and try again.");
  } finally {
    $("go").disabled = false;
    $("text").focus();
  }
}

$("pass").value = store.get("clerk.pass");
$("who").value = store.get("clerk.who");
if ($("pass").value && $("who").value) $("setup").open = false;
$("pass").addEventListener("change", remember);
$("who").addEventListener("change", remember);

add("note", "This is the real clerk with a test front door. Anything that records or changes a sale really does, so test with care.");

["help", "low stock", "sales today", "what do we have in white paper"].forEach((label) => {
  const chip = document.createElement("button");
  chip.type = "button";
  chip.className = "chip";
  chip.textContent = label;
  chip.addEventListener("click", () => send(label));
  $("chips").appendChild(chip);
});

$("clear").addEventListener("click", () => { $("log").textContent = ""; });

function submit() {
  const text = $("text").value.trim();
  if (!text || $("go").disabled) return;
  $("text").value = "";
  $("text").style.height = "auto";
  send(text);
}
$("form").addEventListener("submit", (e) => { e.preventDefault(); submit(); });
$("text").addEventListener("input", () => {
  const box = $("text");
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, 120) + "px";
});
// On a computer Enter sends; on a phone Enter makes a new line and the round button sends.
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(pointer: fine)").matches) {
    e.preventDefault();
    submit();
  }
});
</script>
</body>
</html>
